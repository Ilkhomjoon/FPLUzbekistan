name: Deadline statistikasi

on:
  # Jadval bo'yicha ishga tushirish tashqi cron (cron-job.org) orqali —
  # `scheduled: true` kirituvchisi bilan. GitHub cron'lari olib tashlandi:
  # ular 8-10 soat kechikardi va tashqi cron bilan birga ishlaganda
  # postlar ikki marta chiqib ketardi. Sozlash: docs/tashqi-cron.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Vaqt oynasini e'tiborsiz qoldirib, hoziroq chiqarish"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-deadline-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    # kutish (200 daqiqagacha) + liga skaneri
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Statistikani yig'ish va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ligalar: "id:yorliq" vergul bilan ajratilgan
          STATS_LEAGUES: "137243:🏆 FPLUzbekistan,251:🇺🇿 Uzbekistan"
          # Birinchi o'yingacha shuncha daqiqa qolganda post chiqadi
          STATS_LEAD: "40"
          # shuncha daqiqadan kam qolgan bo'lsa jarayon kutib turadi
          STATS_WAKE_LEAD: "200"
          STATS_WORKERS: "6"
          # Har bir ligada nechta sardor ko'rsatilsin
          STATS_TOP_N: "5"
        run: |
          ARGS="--wait"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m bot.deadline_stats $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update deadline stats state"
