name: Deadline statistikasi

on:
  schedule:
    # STRATEGIYA: kuniga 5 marta uyg'onamiz (ilgari 56 marta edi).
    # --wait rejimida jarayon chiqib ketmaydi: birinchi o'yingacha
    # STATS_WAKE_LEAD (200) daqiqadan kam qolgan bo'lsa, u T-40 daqiqagacha
    # uxlab kutadi va postni aynan o'sha daqiqada chiqaradi.
    # Uyg'onishlar orasi 180 daqiqa < 200 — ya'ni hech bir tur o'tkazib yuborilmaydi.
    - cron: "23 7,10,13,16,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Vaqt oynasini e'tiborsiz qoldirib, hoziroq chiqarish"
        type: boolean
        default: false

concurrency:
  group: fpl-deadline-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    # kutish (200 daqiqagacha) + liga skaneri
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Statistikani yig'ish va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ligalar: "id:yorliq" vergul bilan ajratilgan
          STATS_LEAGUES: "137243:🏆 FPLUzbekistan,251:🇺🇿 Uzbekistan"
          # Birinchi o'yingacha shuncha daqiqa qolganda post chiqadi
          STATS_LEAD: "40"
          # shuncha daqiqadan kam qolgan bo'lsa jarayon kutib turadi
          STATS_WAKE_LEAD: "200"
          STATS_WORKERS: "6"
          # Har bir ligada nechta sardor ko'rsatilsin
          STATS_TOP_N: "5"
        run: |
          ARGS="--wait"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m bot.deadline_stats $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update deadline stats state"
