name: Jonli bonus ochkolar

on:
  schedule:
    # Har 15 daqiqada uyg'onadi. Agar o'sha kuni o'yin bo'lmasa yoki hali
    # boshlanmagan bo'lsa — skript darhol chiqadi (bir necha soniya sarflanadi).
    # 10:00–22:59 UTC oralig'i Premier League o'yin vaqtlarini qoplaydi.
    # Daqiqalar 5/20/35/50 — :00 GitHub'da eng band daqiqa, o'sha paytda
    # cron 15-25 daqiqagacha kechikadi. Chetroq daqiqalarda kechikish kamroq.
    - cron: "5,20,35,50 10-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      once:
        description: "Faqat bir marta yangilab chiqsin (qo'lda sinash uchun)"
        type: boolean
        default: false

concurrency:
  group: fpl-live-bonus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    # GitHub bitta job uchun maksimum 6 soat beradi; biz 5.5 soatda to'xtaymiz,
    # keyingi cron ishni davom ettiradi (xabar id'si data/live_message.json da).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cron kechikishini o'lchash
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          CRON_WORKFLOW: "Jonli bonus"
          # 15 daqiqalik jadvalda kichik kechikish xabar vaqtiga ta'sir qilmaydi
          CRON_ALERT_MINUTES: "30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m scripts.cron_delay

      - name: Jonli bonusni kuzatish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIVE_INTERVAL: "60"
          LIVE_MAX_MINUTES: "320"
          # Cron har 30 daqiqada uyg'onadi. "35 daqiqa oldindan" degani —
          # o'yindan oldingi oxirgi uyg'onishda jarayon chiqib ketmaydi,
          # boshlanishini kutib turadi va xabarni aynan o'sha daqiqada yuboradi.
          LIVE_START_LEAD: "35"
          STATE_COMMIT_CMD: 'bash scripts/commit_state.sh "update live message state"'
        run: python -m bot.live_bonus ${{ inputs.once && '--once' || '' }}

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update live message state"
