name: Jonli bonus ochkolar

on:
  schedule:
    # STRATEGIYA: kam uyg'onamiz, lekin ERTA. Jarayon chiqib ketmaydi —
    # birinchi o'yin boshlanishini o'zi kutadi (LIVE_START_LEAD=115 daqiqa).
    # Shu tufayli cron 40-50 daqiqa kechiksa ham xabar aynan o'yin
    # boshlanishida chiqadi.
    #
    # Ikki qator birgalikda har 90 daqiqada bitta uyg'onish beradi
    # (08:11, 09:41, 11:11, 12:41, ... UTC). Ilgari kuniga 56 ta run bo'lgan,
    # endi 10 ta — GitHub navbatiga yuk kamayadi, kechikish ham kamayadi.
    - cron: "11 8,11,14,17,20 * * *"
    - cron: "41 9,12,15,18,21 * * *"
    # Yakuniy yangilanish: kun tugagach FPL rasmiy bonus va DefCon'ni
    # bir necha soatdan keyin yakunlaydi. Bu uyg'onishlar shuni ushlaydi.
    - cron: "13 1,3,5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      once:
        description: "Faqat bir marta yangilab chiqsin (qo'lda sinash uchun)"
        type: boolean
        default: false
      final:
        description: "Yakuniy yangilanish (kun tugagach rasmiy bonus/DefCon)"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-live-bonus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    # GitHub bitta job uchun maksimum 6 soat beradi; biz 5.5 soatda to'xtaymiz,
    # keyingi cron ishni davom ettiradi (xabar id'si data/live_message.json da).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # GitHub cron'ni shartli qilib bo'lmaydi, shuning uchun darvozani shu
      # yerda qo'yamiz: o'yin yo'q kunlari qolgan qadamlar umuman bajarilmaydi.
      - name: Bugun o'yin bormi?
        id: gate
        run: python -m scripts.matchday

      - name: Cron kechikishini o'lchash
        if: steps.gate.outputs.active == 'true' 
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          CRON_WORKFLOW: "Jonli bonus"
          CRON_RUN_CREATED_AT: ${{ github.run_started_at }}
          # Jarayon o'yin boshlanishini o'zi kutadi — kechikish xabar vaqtiga
          # ta'sir qilmaydi, shuning uchun ogohlantirish chegarasi baland
          CRON_ALERT_MINUTES: "90"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m scripts.cron_delay

      - name: Jonli bonusni kuzatish
        if: steps.gate.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Bonus ro'yxatiga tushish uchun eng kam BPS. O'yinga chiqqani uchun 3,
          # 60-daqiqadan keyin 6 beriladi — chegarani shu yerdan sozlaysiz.
          BONUS_MIN_BPS: "5"
          LIVE_INTERVAL: "60"
          LIVE_MAX_MINUTES: "320"
          # Cron har 90 daqiqada uyg'onadi. 115 daqiqa — uyg'onishlar orasidagi
          # masofadan kattaroq, ya'ni har bir o'yin albatta qamrab olinadi.
          # Jarayon shu oynaga tushsa chiqib ketmaydi: o'yin boshlanishini
          # uxlab kutadi va xabarni aynan o'sha daqiqada yuboradi.
          LIVE_START_LEAD: "115"
          # o'yingacha shuncha soniya qolganda uyqudan turib so'rov boshlaymiz
          LIVE_PREKICK_POLL: "60"
          STATE_COMMIT_CMD: 'bash scripts/commit_state.sh "update live message state"'
        run: |
          ARGS=""
          # tungi cron -> yakuniy yangilanish, kunduzgisi -> jonli kuzatuv
          if [ "${{ github.event.schedule }}" = "13 1,3,5 * * *" ]; then ARGS="--final"; fi
          if [ "${{ inputs.final }}" = "true" ]; then ARGS="--final"; fi
          if [ "${{ inputs.once }}" = "true" ]; then ARGS="--once"; fi
          echo "Ishga tushirilmoqda: python -m bot.live_bonus $ARGS"
          python -m bot.live_bonus $ARGS

      - name: Holatni saqlash (commit)
        if: always() && steps.gate.outputs.active == 'true' 
        run: bash scripts/commit_state.sh "update live message state"
