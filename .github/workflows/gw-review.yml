name: Tur yakunlari sharhi

on:
  # Jadval bo'yicha ishga tushirish tashqi cron (cron-job.org) orqali —
  # `scheduled: true` kirituvchisi bilan. GitHub cron'lari olib tashlandi:
  # ular 8-10 soat kechikardi va tashqi cron bilan birga ishlaganda
  # postlar ikki marta chiqib ketardi. Sozlash: docs/tashqi-cron.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Vaqt tekshiruvini e'tiborsiz qoldirib, hoziroq chiqarish"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-gw-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    # 12:30 dan lockdown'gacha kutish (qishda ~1.5 soat) + liga skaneri
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sharhni tayyorlash va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Birinchi liga "bizniki" — eng katta ko'tarilish faqat unda yoziladi
          STATS_LEAGUES: "137243:🏆 FPLUzbekistan,251:🇺🇿 Uzbekistan"
          GW_REVIEW_TOP_N: "5"
          # FPL tasdig'ini shu vaqtgacha kutamiz (Toshkent)
          GW_REVIEW_UNTIL: "18:00"
          GW_REVIEW_POLL: "180"
          # CDN eski nusxa qaytarishi mumkin — ikki marta ketma-ket tasdiq talab qilamiz
          GW_REVIEW_CONFIRM: "2"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          if [ "${{ inputs.scheduled }}" = "true" ]; then
            ARGS="$ARGS --watch --window 09:00-19:00"
          fi
          python -m bot.gw_review $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update gw review state"
