name: Tur yakunlari sharhi

on:
  schedule:
    # 2026/27 dan FPL ochkolarni turning oxirgi o'yinidan keyingi kuni
    # Britaniya vaqti bilan 09:00 da yakuniy qiladi ("lockdown"):
    #   yozda (BST) = 08:00 UTC = 13:00 Toshkent
    #   qishda (GMT) = 09:00 UTC = 14:00 Toshkent
    # Aniq soat yozib bo'lmaydi, shuning uchun erta uyg'onib kuzatamiz.
    # Cron 3 soatgacha kechikishi mumkin, shuning uchun zaxira katta:
    #   06:30 UTC = 11:30 Toshkent (lockdown'dan 1.5 soat oldin)
    - cron: "30 6 * * *"
    # Ikkinchi kuzatuvchi (14:30 Toshkent) — birinchisi tushib qolsa yoki
    # vaqti tugasa, kuzatishni shu davom ettiradi
    - cron: "30 9 * * *"
    # Oxirgi zaxira (17:44 Toshkent): bir marta tekshirib chiqadi
    - cron: "44 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Vaqt tekshiruvini e'tiborsiz qoldirib, hoziroq chiqarish"
        type: boolean
        default: false

concurrency:
  group: fpl-gw-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    # 12:30 dan lockdown'gacha kutish (qishda ~1.5 soat) + liga skaneri
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sharhni tayyorlash va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Birinchi liga "bizniki" — eng katta ko'tarilish faqat unda yoziladi
          STATS_LEAGUES: "137243:🏆 FPLUzbekistan,251:🇺🇿 Uzbekistan"
          GW_REVIEW_TOP_N: "5"
          # FPL tasdig'ini shu vaqtgacha kutamiz (Toshkent)
          GW_REVIEW_UNTIL: "18:00"
          GW_REVIEW_POLL: "180"
          # CDN eski nusxa qaytarishi mumkin — ikki marta ketma-ket tasdiq talab qilamiz
          GW_REVIEW_CONFIRM: "2"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # Asosiy cron FPL tasdig'ini kuzatadi; zaxira cron esa
          # (lockdown allaqachon o'tgan) bir marta tekshirib chiqadi.
          case "${{ github.event.schedule }}" in
            "30 6 * * *"|"30 9 * * *") ARGS="$ARGS --watch" ;;
          esac
          # Sharh faqat kunduzi chiqsin — kechikkan job uni tunda yubormasin
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --window 09:00-19:00"; fi
          python -m bot.gw_review $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update gw review state"
