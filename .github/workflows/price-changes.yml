name: Narx o'zgarishlari

on:
  schedule:
    # STRATEGIYA: cron'ga ishonmaymiz, uni ataylab ERTA qo'yamiz.
    # Jarayon o'zi FPL narxlarni o'zgartirishini kutadi va postni aynan
    # PRICE_POST_AT (06:00 Toshkent) da yuboradi. GitHub cron 1 soat kechikib
    # uyg'otsa ham post o'z vaqtida chiqadi.
    #
    # 21:07 UTC = 02:07 Toshkent -> 06:00 gacha 3 soat 53 daqiqa zaxira.
    # Daqiqa "07" — :00, :15, :30, :45 GitHub'da eng band daqiqalar.
    - cron: "7 21 * * *"
    # Zaxira: agar yuqoridagi run umuman ishga tushmasa (GitHub ba'zan
    # rejalashtirilgan run'ni tashlab ketadi), 06:39 Toshkent da oddiy
    # bir martalik tekshiruv. O'zgarish bo'lmasa post yo'q.
    - cron: "39 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-price-changes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    # Kuzatuv rejimi 04:07 dan 06:00 gacha kutadi — shuning uchun uzoq timeout
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cron kechikishini o'lchash
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          CRON_WORKFLOW: "Narx o'zgarishlari"
          # run yaratilgan vaqt — navbatda turgan vaqtni kechikishdan ajratish uchun
          CRON_RUN_CREATED_AT: ${{ github.run_started_at }}
          # Kechikish endi post vaqtiga ta'sir qilmaydi, shuning uchun
          # ogohlantirish faqat juda katta kechikishda kelsin
          CRON_ALERT_MINUTES: "90"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m scripts.cron_delay

      - name: Narxlarni tekshirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRICE_POST_AT: "06:00"       # Toshkent vaqti bilan
          PRICE_WATCH_UNTIL: "07:30"   # shu vaqtgacha o'zgarish bo'lmasa — post yo'q
          PRICE_POLL: "120"
        run: |
          # Uch xil ishga tushish: tashqi cron (asosiy), GitHub cron (zaxira),
          # qo'lda (cheklovsiz). Tashqi cron `scheduled=true` yuboradi.
          ARGS=""
          if [ "${{ inputs.scheduled }}" = "true" ]; then
            ARGS="--watch --window 05:00-09:00"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--window 05:00-09:00"
            if [ "${{ github.event.schedule }}" = "7 21 * * *" ]; then ARGS="$ARGS --watch"; fi
          fi
          python -m bot.price_changes $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update price snapshot"
