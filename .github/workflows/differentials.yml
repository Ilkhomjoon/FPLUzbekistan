name: Differentiallar

on:
  # Jadval bo'yicha ishga tushirish tashqi cron (cron-job.org) orqali —
  # `scheduled: true` kirituvchisi bilan. GitHub cron'lari olib tashlandi:
  # ular 8-10 soat kechikardi va tashqi cron bilan birga ishlaganda
  # postlar ikki marta chiqib ketardi. Sozlash: docs/tashqi-cron.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Vaqt tekshiruvini e'tiborsiz qoldirib, hoziroq chiqarish"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-differentials
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  differentials:
    runs-on: ubuntu-latest
    # 20:00 gacha kutish + top-100 va liga skaneri
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Differentiallarni tayyorlash va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Birinchi liga "bizniki" — "Bizning ligada" bo'limi shundan olinadi
          STATS_LEAGUES: "137243:🏆 FPLUzbekistan,251:🇺🇿 Uzbekistan"
          DIFF_POST_AT: "20:00"
          DIFF_LATEST: "23:00"
          DIFF_MAX_OWN: "10"      # "differential" chegarasi, %
          DIFF_MIN_POINTS: "7"    # o'tgan turdagi eng kam ochko
          DIFF_TOP_N: "5"
          DIFF_TOP100_SIZE: "100"
          DIFF_TOP100_MIN: "12"
          DIFF_POLL: "true"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m bot.differentials $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update differentials state"
