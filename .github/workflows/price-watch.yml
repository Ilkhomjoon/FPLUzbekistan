name: Narx bashorati

on:
  schedule:
    # Post aniq 23:00 (Toshkent) da chiqadi. GitHub cron 3 soatgacha
    # kechikishi o'lchangan, shuning uchun uyg'onish ATAYLAB juda erta:
    #   13:09 UTC = 18:09 Toshkent -> 23:00 gacha 4 soat 51 daqiqa zaxira
    - cron: "9 13 * * *"
    # Ikkinchi kuzatuvchi (21:09 Toshkent) — birinchisi tushib qolsa
    - cron: "9 16 * * *"
    # Oxirgi zaxira (23:44 Toshkent): kutmasdan darhol chiqaradi
    - cron: "44 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Bugun chiqarilgan bo'lsa ham qayta chiqarish"
        type: boolean
        default: false

concurrency:
  group: fpl-price-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 18:09 dan 23:00 gacha kutish + post
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bashoratni tekshirish va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ro'yxatga tushish uchun eng kam foiz
          PRICE_WATCH_MIN: "85"
          # Har tomonda ko'pi bilan nechta futbolchi
          PRICE_WATCH_MAX: "8"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # Faqat asosiy cron 23:00 gacha kutadi. Zaxira cron (23:44 Toshkent)
          # allaqachon kech — u kutmasdan darhol chiqaradi.
          case "${{ github.event.schedule }}" in
            "9 13 * * *"|"9 16 * * *") ARGS="$ARGS --post-at 23:00" ;;
          esac
          python -m bot.price_watch $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update price watch state"
