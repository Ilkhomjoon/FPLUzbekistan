name: Narx bashorati

on:
  schedule:
    # 22:09 Toshkent da uyg'onamiz, post esa --post-at bilan aniq 23:00 da
    # chiqadi. Cron 50 daqiqa kechiksa ham post o'z vaqtida bo'ladi.
    - cron: "9 17 * * *"
    # Zaxira: birinchi run umuman ishga tushmasa. Holat fayli ikki marta
    # yuborilishiga yo'l qo'ymaydi.
    - cron: "44 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Bugun chiqarilgan bo'lsa ham qayta chiqarish"
        type: boolean
        default: false

concurrency:
  group: fpl-price-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bashoratni tekshirish va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ro'yxatga tushish uchun eng kam foiz
          PRICE_WATCH_MIN: "85"
          # Har tomonda ko'pi bilan nechta futbolchi
          PRICE_WATCH_MAX: "8"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # cron bo'yicha ishga tushganda aniq 23:00 gacha kutamiz;
          # qo'lda ishga tushirilganda darhol chiqaramiz
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --post-at 23:00"; fi
          python -m bot.price_watch $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update price watch state"
