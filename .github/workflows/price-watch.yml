name: Narx bashorati

on:
  # Jadval bo'yicha ishga tushirish tashqi cron (cron-job.org) orqali —
  # `scheduled: true` kirituvchisi bilan. GitHub cron'lari olib tashlandi:
  # ular 8-10 soat kechikardi va tashqi cron bilan birga ishlaganda
  # postlar ikki marta chiqib ketardi. Sozlash: docs/tashqi-cron.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegramga yubormasdan sinash"
        type: boolean
        default: false
      force:
        description: "Bugun chiqarilgan bo'lsa ham qayta chiqarish"
        type: boolean
        default: false
      scheduled:
        description: "Tashqi cron chaqirdi — jadval bo'yicha ishlasin"
        type: boolean
        default: false

concurrency:
  group: fpl-price-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 18:09 dan 23:00 gacha kutish + post
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bashoratni tekshirish va yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ro'yxatga tushish uchun eng kam foiz
          PRICE_WATCH_MIN: "85"
          # Har tomonda ko'pi bilan nechta futbolchi
          PRICE_WATCH_MAX: "8"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # Tashqi cron 22:50 da chaqiradi -> 23:00 gacha ushlab turadi.
          if [ "${{ inputs.scheduled }}" = "true" ]; then
            ARGS="$ARGS --post-at 23:00 --window 20:00-01:00"
          fi
          python -m bot.price_watch $ARGS

      - name: Holatni saqlash (commit)
        if: always()
        run: bash scripts/commit_state.sh "update price watch state"
